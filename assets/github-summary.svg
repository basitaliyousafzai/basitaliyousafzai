<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">Basit Ali — GitHub summary</title>
  <desc id="desc">Live summary of public repositories, stars, followers and languages. Auto-generated.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/><stop offset="52%" stop-color="#172554"/><stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/><stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fff" stop-opacity="0"/><stop offset="50%" stop-color="#fff" stop-opacity=".08"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="card"><rect x="8" y="8" width="1184" height="244" rx="24"/></clipPath>
  </defs>
  <style>
    text { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
    .fade { opacity: 0; animation: fadeUp .8s ease-out forwards; }
    .tile { opacity: 0; animation: fadeUp .8s cubic-bezier(.2,.8,.2,1) forwards; text-anchor: middle; }
    .orb  { animation: float 8s ease-in-out infinite alternate; }
    .bar  { animation: pulse 3s ease-in-out infinite; }
    .shine { animation: sweep 6s ease-in-out infinite; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes float  { from { transform: translate(0,0); } to { transform: translate(-30px,20px); } }
    @keyframes pulse  { 0%,100% { opacity: 1; } 50% { opacity: .45; } }
    @keyframes sweep  { 0% { transform: translateX(-1200px); } 60%,100% { transform: translateX(1200px); } }
  </style>
  <g clip-path="url(#card)">
    <rect x="8" y="8" width="1184" height="244" fill="url(#bg)"/>
    <circle class="orb" cx="1090" cy="-10" r="170" fill="#38bdf8" opacity=".09"/>
    <circle class="orb" cx="1160" cy="230" r="120" fill="#a78bfa" opacity=".09" style="animation-delay:-4s"/>
    <rect class="shine" x="8" y="8" width="400" height="244" fill="url(#shine)"/>
  </g>
  <rect class="bar" x="52" y="55" width="6" height="150" rx="3" fill="url(#accent)"/>
  <text class="fade" x="88" y="78" fill="#bae6fd" font-size="15" font-weight="700" letter-spacing="2">GITHUB PROFILE SUMMARY</text>
  <text class="fade" style="animation-delay:.1s" x="88" y="124" fill="#ffffff" font-size="34" font-weight="700">Basit Ali</text>
  <text class="fade" style="animation-delay:.2s" x="88" y="153" fill="#cbd5e1" font-size="17">Software Engineer · Full-Stack Developer</text>
  <text class="fade" style="animation-delay:.3s" x="88" y="184" fill="#94a3b8" font-size="14">@basitaliyousafzai · Rawalpindi, Pakistan</text>
  <text class="fade" style="animation-delay:.4s" x="88" y="226" fill="#64748b" font-size="11">⚡ Auto-generated from the GitHub API</text>
  
    <g transform="translate(560,72)"><g class="tile" style="animation-delay:0.35s">
      <rect width="136" height="118" rx="16" fill="#ffffff" fill-opacity=".07" stroke="#7dd3fc" stroke-opacity=".25"/>
      <text x="68" y="44" fill="#7dd3fc" font-size="30" font-weight="700">9</text>
      <text x="68" y="72" fill="#e2e8f0" font-size="14">Repositories</text>
      <text x="68" y="94" fill="#94a3b8" font-size="12">public projects</text>
    </g></g>
    <g transform="translate(712,72)"><g class="tile" style="animation-delay:0.50s">
      <rect width="136" height="118" rx="16" fill="#ffffff" fill-opacity=".07" stroke="#c4b5fd" stroke-opacity=".25"/>
      <text x="68" y="44" fill="#c4b5fd" font-size="30" font-weight="700">8</text>
      <text x="68" y="72" fill="#e2e8f0" font-size="14">Stars</text>
      <text x="68" y="94" fill="#94a3b8" font-size="12">across projects</text>
    </g></g>
    <g transform="translate(864,72)"><g class="tile" style="animation-delay:0.65s">
      <rect width="136" height="118" rx="16" fill="#ffffff" fill-opacity=".07" stroke="#86efac" stroke-opacity=".25"/>
      <text x="68" y="44" fill="#86efac" font-size="30" font-weight="700">0</text>
      <text x="68" y="72" fill="#e2e8f0" font-size="14">Followers</text>
      <text x="68" y="94" fill="#94a3b8" font-size="12">growing network</text>
    </g></g>
    <g transform="translate(1016,72)"><g class="tile" style="animation-delay:0.80s">
      <rect width="136" height="118" rx="16" fill="#ffffff" fill-opacity=".07" stroke="#fcd34d" stroke-opacity=".25"/>
      <text x="68" y="44" fill="#fcd34d" font-size="30" font-weight="700">4</text>
      <text x="68" y="72" fill="#e2e8f0" font-size="14">Languages</text>
      <text x="68" y="94" fill="#94a3b8" font-size="12">in production</text>
    </g></g>
</svg>
