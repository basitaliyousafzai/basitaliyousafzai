<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 160" width="1200" height="160" role="img" aria-label="Footer Banner">
  <defs>
    <linearGradient id="footerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" stop-opacity="0"/>
      <stop offset="40%" stop-color="#0f172a" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0a0f1d"/>
    </linearGradient>

    <linearGradient id="waveFront" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="40%" stop-color="#6366f1" stop-opacity="0.4"/>
      <stop offset="80%" stop-color="#a855f7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="waveBack" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#1e1b4b" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.25"/>
    </linearGradient>

    <clipPath id="footerClip">
      <rect width="1200" height="160" rx="16"/>
    </clipPath>
  </defs>

  <style>
    @keyframes waveSlow {
      0% { transform: translateX(0); }
      50% { transform: translateX(-40px); }
      100% { transform: translateX(0); }
    }
    @keyframes waveFast {
      0% { transform: translateX(0); }
      50% { transform: translateX(35px); }
      100% { transform: translateX(0); }
    }
    .w-slow { animation: waveSlow 14s ease-in-out infinite; }
    .w-fast { animation: waveFast 10s ease-in-out infinite alternate; }
    .footer-font { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  </style>

  <g clip-path="url(#footerClip)">
    <rect width="1200" height="160" fill="url(#footerBg)" />

    <!-- Back wave -->
    <path class="w-slow" fill="url(#waveBack)" d="M -60,70 Q 240,20 540,60 T 1140,40 T 1320,65 L 1320,180 L -60,180 Z" />

    <!-- Front wave -->
    <path class="w-fast" fill="url(#waveFront)" d="M -60,95 Q 260,60 580,90 T 1180,75 T 1320,95 L 1320,180 L -60,180 Z" />

    <!-- Bottom text -->
    <text x="600" y="135" fill="#94a3b8" class="footer-font" font-size="13" font-weight="500" text-anchor="middle" letter-spacing="1">
      CRAFTED WITH PRECISION BY BASIT ALI · 2026
    </text>
  </g>
</svg>
