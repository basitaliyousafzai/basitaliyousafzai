<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">Basit Ali - Full-Stack Software Engineer</title>
  <desc id="heroDesc">Enterprise .NET and Angular Specialist, ERP, WMS, SQL Server Architect</desc>

  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="35%" stop-color="#0f172a"/>
      <stop offset="70%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Vibrant Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Wave 1 Gradient -->
    <linearGradient id="wave1Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.15"/>
    </linearGradient>

    <!-- Wave 2 Gradient -->
    <linearGradient id="wave2Grad" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#2563eb" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0.25"/>
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <clipPath id="cardClip">
      <rect x="0" y="0" width="1200" height="320" rx="20"/>
    </clipPath>
  </defs>

  <style>
    @keyframes floatParticle {
      0%, 100% { transform: translateY(0px) scale(1); opacity: 0.3; }
      50% { transform: translateY(-18px) scale(1.3); opacity: 0.8; }
    }
    @keyframes waveMove1 {
      0% { transform: translateX(0); }
      50% { transform: translateX(-60px); }
      100% { transform: translateX(0); }
    }
    @keyframes waveMove2 {
      0% { transform: translateX(0); }
      50% { transform: translateX(50px); }
      100% { transform: translateX(0); }
    }
    @keyframes pulseOrb {
      0%, 100% { opacity: 0.4; transform: scale(1); }
      50% { opacity: 0.85; transform: scale(1.15); }
    }
    @keyframes blinkCursor {
      0%, 45% { opacity: 1; }
      50%, 95% { opacity: 0; }
      100% { opacity: 1; }
    }

    /* Terminal Multi-Line Typing Cycle */
    @keyframes typeCycle1 {
      0%, 28% { opacity: 1; transform: translateY(0); }
      32%, 100% { opacity: 0; transform: translateY(-10px); }
    }
    @keyframes typeCycle2 {
      0%, 31% { opacity: 0; transform: translateY(10px); }
      35%, 62% { opacity: 1; transform: translateY(0); }
      66%, 100% { opacity: 0; transform: translateY(-10px); }
    }
    @keyframes typeCycle3 {
      0%, 65% { opacity: 0; transform: translateY(10px); }
      69%, 95% { opacity: 1; transform: translateY(0); }
      99%, 100% { opacity: 0; transform: translateY(-10px); }
    }

    .p1 { animation: floatParticle 6s ease-in-out infinite; transform-origin: center; }
    .p2 { animation: floatParticle 8s ease-in-out infinite 2s; transform-origin: center; }
    .p3 { animation: floatParticle 7s ease-in-out infinite 4s; transform-origin: center; }
    .w1 { animation: waveMove1 12s ease-in-out infinite; }
    .w2 { animation: waveMove2 10s ease-in-out infinite alternate; }
    .orb { animation: pulseOrb 4s ease-in-out infinite; transform-origin: center; }
    .cursor { animation: blinkCursor 0.9s infinite; }
    .text-line1 { animation: typeCycle1 12s infinite; }
    .text-line2 { animation: typeCycle2 12s infinite; }
    .text-line3 { animation: typeCycle3 12s infinite; }

    .code-font {
      font-family: 'Fira Code', 'Cascadia Code', 'JetBrains Mono', Consolas, 'Courier New', monospace;
    }
    .main-font {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
  </style>

  <!-- Main Background Container -->
  <g clip-path="url(#cardClip)">
    <rect width="1200" height="320" fill="url(#bgGrad)" />

    <!-- Ambient Glowing Nebulas -->
    <circle class="orb" cx="150" cy="80" r="140" fill="#38bdf8" opacity="0.12" filter="url(#glow)"/>
    <circle class="orb" cx="1080" cy="120" r="160" fill="#818cf8" opacity="0.1" filter="url(#glow)"/>
    <circle class="orb" cx="600" cy="280" r="130" fill="#c084fc" opacity="0.08" filter="url(#glow)"/>

    <!-- Subtle Tech Grid Lines -->
    <g stroke="#ffffff" stroke-opacity="0.035" stroke-width="1">
      <line x1="0" y1="80" x2="1200" y2="80"/>
      <line x1="0" y1="160" x2="1200" y2="160"/>
      <line x1="0" y1="240" x2="1200" y2="240"/>
      <line x1="200" y1="0" x2="200" y2="320"/>
      <line x1="400" y1="0" x2="400" y2="320"/>
      <line x1="600" y1="0" x2="600" y2="320"/>
      <line x1="800" y1="0" x2="800" y2="320"/>
      <line x1="1000" y1="0" x2="1000" y2="320"/>
    </g>

    <!-- Flowing Wave 1 -->
    <path class="w1" fill="url(#wave1Grad)" d="M -50,220 Q 200,160 450,210 T 950,190 T 1300,220 L 1300,340 L -50,340 Z"/>

    <!-- Flowing Wave 2 -->
    <path class="w2" fill="url(#wave2Grad)" d="M -50,250 Q 250,200 550,240 T 1050,220 T 1300,260 L 1300,340 L -50,340 Z"/>

    <!-- Floating Sparkle Particles -->
    <circle class="p1" cx="240" cy="65" r="3" fill="#38bdf8" />
    <circle class="p2" cx="480" cy="110" r="2.5" fill="#a78bfa" />
    <circle class="p3" cx="890" cy="70" r="3.5" fill="#38bdf8" />
    <circle class="p1" cx="1020" cy="180" r="2" fill="#34d399" />
    <circle class="p2" cx="160" cy="220" r="2" fill="#c084fc" />

    <!-- Top Status Pill Badge -->
    <g transform="translate(60, 42)">
      <rect width="360" height="30" rx="15" fill="#ffffff" fill-opacity="0.08" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1"/>
      <circle cx="18" cy="15" r="5" fill="#22c55e" filter="url(#glow)"/>
      <circle cx="18" cy="15" r="3" fill="#ffffff"/>
      <text x="34" y="20" fill="#bae6fd" class="code-font" font-size="12" font-weight="600" letter-spacing="1.2">
        FULL-STACK SOFTWARE ENGINEER
      </text>
    </g>

    <!-- Top Right Quick Metric Pills -->
    <g transform="translate(740, 42)">
      <!-- Pill 1: Experience -->
      <g transform="translate(0, 0)">
        <rect width="130" height="30" rx="15" fill="#ffffff" fill-opacity="0.06" stroke="#818cf8" stroke-opacity="0.3" stroke-width="1"/>
        <text x="65" y="19" fill="#c7d2fe" class="main-font" font-size="12" font-weight="600" text-anchor="middle">⚡ 2+ Yrs Exp</text>
      </g>
      <!-- Pill 2: Architecture -->
      <g transform="translate(142, 0)">
        <rect width="150" height="30" rx="15" fill="#ffffff" fill-opacity="0.06" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1"/>
        <text x="75" y="19" fill="#bae6fd" class="main-font" font-size="12" font-weight="600" text-anchor="middle">🏛️ Clean Arch</text>
      </g>
      <!-- Pill 3: Location -->
      <g transform="translate(304, 0)">
        <rect width="96" height="30" rx="15" fill="#ffffff" fill-opacity="0.06" stroke="#34d399" stroke-opacity="0.3" stroke-width="1"/>
        <text x="48" y="19" fill="#a7f3d0" class="main-font" font-size="12" font-weight="600" text-anchor="middle">🇵🇰 PK</text>
      </g>
    </g>

    <!-- Main Title: BASIT ALI -->
    <g transform="translate(60, 138)">
      <text class="main-font" font-size="56" font-weight="900" fill="url(#accentGrad)" letter-spacing="-1">
        Basit Ali
      </text>
      <text class="main-font" font-size="17" font-weight="500" fill="#94a3b8" x="255" y="-12">
        Software Engineer &amp; Enterprise Architect
      </text>
    </g>

    <!-- Interactive Terminal Typing Box -->
    <g transform="translate(60, 168)">
      <!-- Terminal Glass Background -->
      <rect width="1080" height="66" rx="14" fill="#030712" fill-opacity="0.6" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="1.2"/>
      
      <!-- Terminal Header Dots -->
      <circle cx="24" cy="22" r="5" fill="#ef4444" fill-opacity="0.8"/>
      <circle cx="40" cy="22" r="5" fill="#f59e0b" fill-opacity="0.8"/>
      <circle cx="56" cy="22" r="5" fill="#10b981" fill-opacity="0.8"/>
      <text x="80" y="26" fill="#64748b" class="code-font" font-size="11" letter-spacing="1">bash · profile.env</text>

      <!-- Terminal Prompt Prefix -->
      <text x="24" y="49" fill="#38bdf8" class="code-font" font-size="16" font-weight="700">λ</text>
      <text x="42" y="49" fill="#a78bfa" class="code-font" font-size="15" font-weight="600">role</text>
      <text x="82" y="49" fill="#64748b" class="code-font" font-size="15">::</text>

      <!-- Dynamic Rotating Terminal Lines -->
      <g transform="translate(105, 49)">
        <!-- Line 1 -->
        <g class="text-line1">
          <text fill="#f1f5f9" class="code-font" font-size="15" font-weight="500">
            Full-Stack Engineer specializing in .NET 8/9 &amp; Angular Enterprise Ecosystems
          </text>
        </g>
        <!-- Line 2 -->
        <g class="text-line2">
          <text fill="#38bdf8" class="code-font" font-size="15" font-weight="500">
            Architecting Scalable ERPs, High-Throughput WMS &amp; Real-Time POS Platforms
          </text>
        </g>
        <!-- Line 3 -->
        <g class="text-line3">
          <text fill="#c084fc" class="code-font" font-size="15" font-weight="500">
            Designing Optimized SQL Server Schemas, Stored Procs &amp; Clean Architecture
          </text>
        </g>
      </g>

      <!-- Blinking Cursor -->
      <rect class="cursor" x="870" y="36" width="9" height="17" rx="2" fill="#38bdf8"/>
    </g>

    <!-- Bottom Feature Pills Bar -->
    <g transform="translate(60, 262)">
      <!-- Item 1: .NET -->
      <g transform="translate(0, 0)">
        <rect width="160" height="34" rx="10" fill="url(#cardGrad)" stroke="#512bd4" stroke-opacity="0.4" stroke-width="1"/>
        <circle cx="20" cy="17" r="4" fill="#a78bfa"/>
        <text x="34" y="22" fill="#e2e8f0" class="code-font" font-size="13" font-weight="600">ASP.NET Core</text>
      </g>
      <!-- Item 2: Angular -->
      <g transform="translate(175, 0)">
        <rect width="135" height="34" rx="10" fill="url(#cardGrad)" stroke="#dd0031" stroke-opacity="0.4" stroke-width="1"/>
        <circle cx="20" cy="17" r="4" fill="#f87171"/>
        <text x="34" y="22" fill="#e2e8f0" class="code-font" font-size="13" font-weight="600">Angular 17+</text>
      </g>
      <!-- Item 3: SQL Server -->
      <g transform="translate(325, 0)">
        <rect width="145" height="34" rx="10" fill="url(#cardGrad)" stroke="#cc292b" stroke-opacity="0.4" stroke-width="1"/>
        <circle cx="20" cy="17" r="4" fill="#fb7185"/>
        <text x="34" y="22" fill="#e2e8f0" class="code-font" font-size="13" font-weight="600">SQL Server</text>
      </g>
      <!-- Item 4: Clean Architecture -->
      <g transform="translate(485, 0)">
        <rect width="175" height="34" rx="10" fill="url(#cardGrad)" stroke="#0284c7" stroke-opacity="0.4" stroke-width="1"/>
        <circle cx="20" cy="17" r="4" fill="#38bdf8"/>
        <text x="34" y="22" fill="#e2e8f0" class="code-font" font-size="13" font-weight="600">Clean Architecture</text>
      </g>
      <!-- Item 5: ERP & WMS -->
      <g transform="translate(675, 0)">
        <rect width="170" height="34" rx="10" fill="url(#cardGrad)" stroke="#10b981" stroke-opacity="0.4" stroke-width="1"/>
        <circle cx="20" cy="17" r="4" fill="#34d399"/>
        <text x="34" y="22" fill="#e2e8f0" class="code-font" font-size="13" font-weight="600">ERP / WMS Systems</text>
      </g>
      <!-- Item 6: REST APIs -->
      <g transform="translate(860, 0)">
        <rect width="150" height="34" rx="10" fill="url(#cardGrad)" stroke="#f59e0b" stroke-opacity="0.4" stroke-width="1"/>
        <circle cx="20" cy="17" r="4" fill="#fbbf24"/>
        <text x="34" y="22" fill="#e2e8f0" class="code-font" font-size="13" font-weight="600">RESTful Web APIs</text>
      </g>
    </g>

    <!-- Outer Border with Glow -->
    <rect x="0.5" y="0.5" width="1199" height="319" rx="20" fill="none" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="1"/>
  </g>
</svg>
