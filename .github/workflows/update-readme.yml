name: 🔄 Auto-Update Profile README

on:
  schedule:
    - cron: "0 * * * *" # Runs every hour to automatically sync newly added or deleted repositories
  workflow_dispatch: # Allows manual 1-click execution from GitHub Actions UI
  repository_dispatch: # Allows webhook triggers when repositories are created or deleted
    types: [repo_sync, repository_changed]
  push:
    branches: [main]
    paths:
      - ".github/projects.config.json"
      - ".github/scripts/**"
      - ".github/workflows/update-readme.yml"

permissions:
  contents: write

concurrency:
  group: update-readme
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 🧠 Fetch repos & regenerate README
        run: node .github/scripts/update-readme.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USERNAME: ${{ github.repository_owner }}

      - name: 🚀 Commit changes (only if something changed)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "docs: 🤖 auto-update projects & stats"
            git push
          fi
